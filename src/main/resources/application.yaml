spring:
  application:
    name: QRProject

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/qrProject?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root

    hikari:
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
backup:
  dir: ./backups
  schema-dir: ./backups/schema      # file cấu trúc DB
  data-dir: ./backups/data          # file data tuần/tháng
  mysqldump-path: "C:/Program Files/MySQL/MySQL Server 8.0/bin/mysqldump.exe"
  database: qrProject
  username: root
  password: root
  host: localhost
  port: 3306
  # Bảng dữ liệu nghiệp vụ (sinh ra hằng ngày) — sẽ backup theo tuần/tháng
#  data-tables: don_bao_cao_entity,nhiem_vu_ngay_entity,ct_dang_ct_entity,ca_truc_entity,nhat_ky_entity,thong_bao_entity

jwt:
  valid-duration: 3600
  refreshable-duration: 360000
